services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: skeleton-go:local
    init: true
    restart: unless-stopped
    ports:
      - "${APP_PORT:-38600}:38600"
    environment:
      SKELETON_SERVER_HOST: "0.0.0.0"
      SKELETON_SERVER_PORT: "38600"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
