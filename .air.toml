root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
delay = 300
exclude_dir = [".git", "tmp", "vendor", "testdata"]
exclude_regex = ["_test.go"]
include_ext = ["go", "html", "css", "js", "yaml"]
kill_delay = "2s"
log = "build-errors.log"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
